syntax = "proto3";

message Airport {
  string airport = 2;
}

message FlightData {
  string date = 2;
  Airport from_airport = 13;
  Airport to_airport = 14;
  optional int32 max_stops = 5;
  repeated string airlines = 6;
}

enum Seat {
  UNKNOWN_SEAT = 0;
  ECONOMY = 1;
  PREMIUM_ECONOMY = 2;
  BUSINESS = 3;
  FIRST = 4;
}

enum Trip {
  UNKNOWN_TRIP = 0;
  ROUND_TRIP = 1;
  ONE_WAY = 2;
  MULTI_CITY = 3; // not implemented
}

enum Passenger {
  UNKNOWN_PASSENGER = 0;
  ADULT = 1;
  CHILD = 2;
  INFANT_IN_SEAT = 3;
  INFANT_ON_LAP  = 4;
}

message Info {
  repeated FlightData data = 3;
  Seat seat = 9;
  repeated Passenger passengers = 8;
  Trip trip = 19;
}

message Price {
  int32 price = 1;
  string currency = 3;
}

message ItinerarySummary {
  string flights = 2;
  Price price = 3;
}

// Message for the tfu parameter (price sorting preference)
enum SortType {
  UNKNOWN_SORT = 0;
  BEST = 1;
  CHEAPEST = 2;
}

message SortPreference {
  int32 field1 = 1;  // Always 2
  SortType sort_type = 4;
  int32 field5 = 5;  // 20 for Best, 21 for Cheapest
}

message TfuData {
  SortPreference preference = 2;
  bytes field4 = 4;  // Empty bytes
}
